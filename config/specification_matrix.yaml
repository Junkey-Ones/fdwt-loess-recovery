applicability:
  unlisted_family: 该估计对象未登记该定义族，记 not_applicable。
  unsupported_input: 未获数据放行或缺少适用年份、变量或网格时，记 not_applicable 并列明原因。
  exposure_window: 仅用事件前完整年，按该版本的覆盖和有效年门槛核定；NDVI 比较限制在共同样本。
  product: P 阈值各产品独立估计。CHIRPS 只替换降水，不能提供 W、SMP 或深层水。
  threshold: 湿候阈值仅在合格湿候数达到配置门槛时适用。
  weighting: 主规格只计一次。定义族等权汇总使用各族适用敏感性规格，报告各族分母。
  redundant_precip_replacement: 仅用恢复或 W 序列的估计对象排除 CHIRPS 降水替换；联合替换在这些估计对象中与 GLDAS 陆面复算重复。
